# Fork build identity for yjuyjuy/herdr.
#
# This fork carries merged jcode agent support on top of upstream herdr and is
# consumed by the firstmate installer (bin/fm-install-herdr.sh). Every build of
# this fork should report a clearly fork-suffixed version so it can never be
# mistaken for an upstream herdr release.
#
# These values are read at compile time by src/build_info.rs via option_env!,
# producing a reported version of the form "<BASE_VERSION>-fm.<build id>" (for
# example 0.7.5-fm.1). Cargo.toml's version stays a clean semver, so
# update::Version::current() still parses BASE_VERSION and never panics, and the
# self-update comparison logic is unaffected. The channel is deliberately not
# "preview", so update behavior stays on the stable path.
#
# Bump HERDR_BUILD_ID when cutting a new fork release from a new fork commit.
[env]
HERDR_BUILD_CHANNEL = "fm"
HERDR_BUILD_ID = "1"
