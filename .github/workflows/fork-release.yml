name: Fork Release

# Fork-only release workflow for yjuyjuy/herdr.
#
# Builds the four supported platform binaries from the current commit with a
# fork build channel so the binary reports a clearly fork-suffixed version
# (for example 0.7.5-fm.1), then cuts a GitHub Release with those assets under
# a fork-suffixed tag that can never collide with an upstream vX.Y.Z tag.
#
# This is intentionally separate from the upstream Release workflow: it does not
# run the upstream flake-check, changelog product-announcement validation, docs
# publishing, or issue-closing steps, none of which apply to a private fork
# release consumed only by the firstmate installer. It installs the patched
# Homebrew zig@0.15 on macOS (matching release.yml), which the manual build
# workflow does not, so the macOS targets link correctly.

on:
  workflow_dispatch:
    inputs:
      build_channel:
        description: fork build channel label embedded in the reported version
        required: true
        default: fm
        type: string
      build_id:
        description: fork build id embedded in the reported version (for example 1)
        required: true
        default: '1'
        type: string
      tag:
        description: release tag to create (must be fork-suffixed, for example v0.7.5-fm.1)
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject an upstream-shaped tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "error: tag input is empty" >&2
            exit 1
          fi
          # A fork tag must carry a non-numeric suffix so it can never collide
          # with an upstream vMAJOR.MINOR.PATCH release tag.
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: tag $TAG looks like an upstream release tag; use a fork-suffixed tag such as v0.7.5-fm.1" >&2
            exit 1
          fi

  build:
    needs: validate-inputs
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
      HERDR_BUILD_CHANNEL: ${{ inputs.build_channel }}
      HERDR_BUILD_ID: ${{ inputs.build_id }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-release-${{ matrix.target }}

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Record build info
        run: |
          file ${{ matrix.name }} > BUILD_INFO.txt
          {
            echo "commit=$GITHUB_SHA"
            echo "target=${{ matrix.target }}"
            echo "build_channel=$HERDR_BUILD_CHANNEL"
            echo "build_id=$HERDR_BUILD_ID"
          } >> BUILD_INFO.txt
          python3 -c "import hashlib, pathlib; artifact = pathlib.Path('${{ matrix.name }}'); print(f'sha256={hashlib.sha256(artifact.read_bytes()).hexdigest()}  {artifact.name}')" >> BUILD_INFO.txt
          cat BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            BUILD_INFO.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Assemble release assets and checksums
        run: |
          mkdir -p dist
          for name in herdr-linux-x86_64 herdr-linux-aarch64 herdr-macos-x86_64 herdr-macos-aarch64; do
            cp "$name/$name" "dist/$name"
          done
          (cd dist && sha256sum herdr-* | tee SHA256SUMS.txt)

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Fork release of yjuyjuy/herdr built with build channel
            `${{ inputs.build_channel }}` and build id `${{ inputs.build_id }}`.

            This is a private fork release consumed by the firstmate installer
            (`bin/fm-install-herdr.sh`). It carries the merged jcode agent support
            on top of upstream herdr 0.7.5. The binary reports a fork-suffixed
            version and is not an upstream herdr release.

            Assets are pinned by SHA-256 in the firstmate installer; see
            `dist/SHA256SUMS.txt` for the checksums.
          files: |
            dist/herdr-linux-x86_64
            dist/herdr-linux-aarch64
            dist/herdr-macos-x86_64
            dist/herdr-macos-aarch64
            dist/SHA256SUMS.txt
